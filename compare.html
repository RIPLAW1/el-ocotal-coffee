<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>El Ocotal · Before / After</title>
<link href="assets/fonts.css" rel="stylesheet">
<style>
:root{--saco:#F1D417;--resina:#12110D;--foil:#C9A45C;--hueso:#F3EEE1}
*{box-sizing:border-box;margin:0}
body{background:var(--resina);color:var(--hueso);font-family:Montserrat,system-ui,sans-serif;padding:32px 16px 48px}
h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:clamp(2rem,4vw,3rem);text-align:center;color:var(--foil)}
.sub{text-align:center;opacity:.65;font-size:.85rem;margin:8px 0 32px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;max-width:1400px;margin:0 auto}
.col h2{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:12px;color:var(--foil)}
.col p{font-size:.85rem;opacity:.7;margin-top:12px;line-height:1.6}
.before img{width:100%;border-radius:6px}
.after iframe{width:100%;height:80vh;border:1px solid rgba(201,164,92,.3);border-radius:6px;background:#000}
.after a{color:var(--saco)}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>El Ocotal: before / after</h1>
<p class="sub">Unofficial website concept</p>
<div class="grid">
  <div class="col before">
    <h2>Before</h2>
    <img src="assets/bag-photo.jpg" alt="Photo of the El Ocotal coffee bag, the brand's only visual reference">
    <p>No website and almost no social media. The only brand asset is the bag: yellow label, black logo window with gold pines, foil band.</p>
  </div>
  <div class="col after">
    <h2>After</h2>
    <iframe src="index.html" title="El Ocotal concept site"></iframe>
    <p><a href="index.html">Open the full site →</a></p>
  </div>
</div>
</body>
</html>
